name: Build & Package Intel i915 SR-IOV - Unraid 6.18.58

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      KERNEL_VERSION: 6.18.58-Unraid
      DRIVER_REF: 2026.03.05.7

    steps:
      - name: Check out plugin repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install compiler and dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            gcc-14 g++-14 make bc bison flex libelf-dev \
            libssl-dev dwarves kmod xz-utils git perl python3
          gcc-14 --version | head -1
          test "$(gcc-14 -dumpfullversion | cut -d. -f1,2)" = "14.2"
          df -h .

      - name: Download and verify matching Unraid kernel
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="linux-${KERNEL_VERSION}.tar.xz"
          curl -fL --retry 3 -o "$RUNNER_TEMP/$ARCHIVE" \
            "https://github.com/ich777/unraid_kernel/releases/download/${KERNEL_VERSION}/${ARCHIVE}"
          printf '%s  %s\n' \
            'da2ae45037a7f8049bbc9eeb306cf5385f59216c8c055c6ee827d243b016e962' \
            "$RUNNER_TEMP/$ARCHIVE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/kernel"
          tar -xJf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP/kernel"
          test -s "$RUNNER_TEMP/kernel/.config"
          test -s "$RUNNER_TEMP/kernel/Module.symvers"
          grep '^CONFIG_CC_VERSION_TEXT=' "$RUNNER_TEMP/kernel/.config"
          ACTUAL="$(make --no-print-directory -s -C "$RUNNER_TEMP/kernel" kernelrelease)"
          test "$ACTUAL" = "$KERNEL_VERSION" || {
            echo "Kernel release mismatch: $ACTUAL != $KERNEL_VERSION" >&2
            exit 1
          }

      - name: Check out compatible SR-IOV driver source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$DRIVER_REF" \
            https://github.com/strongtz/i915-sriov-dkms.git "$RUNNER_TEMP/i915-sriov-dkms"
          git -C "$RUNNER_TEMP/i915-sriov-dkms" rev-parse HEAD

      # Raptor Lake hosts use i915, not xe. The upstream DKMS tree builds
      # both by default; disabling xe avoids compiling unrelated Xe driver.
      - name: Disable unused xe module for i915-only build
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/i915-sriov-dkms/Makefile" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          code = path.read_text()
          target = "obj-m += drivers/gpu/drm/xe/\n"
          found = code.count(target)
          if found != 1:
              raise SystemExit(f"Expected one xe module target, found {found}")
          path.write_text(code.replace(target, "", 1))
          print("Disabled xe compilation; keeping i915 and compat modules")
          PY

      - name: Adapt DRM client API for Unraid 6.18.58
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/i915-sriov-dkms/drivers/gpu/drm/i915/i915_driver.c" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          code = path.read_text()
          changes = {
              "drm_client_dev_suspend(&i915->drm, false);":
                  "drm_client_dev_suspend(&i915->drm);",
              "drm_client_dev_suspend(dev, false);":
                  "drm_client_dev_suspend(dev);",
              "drm_client_dev_resume(dev, false);":
                  "drm_client_dev_resume(dev);",
          }
          for before, after in changes.items():
              found = code.count(before)
              if found != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {before!r}, got {found}")
              code = code.replace(before, after, 1)
          path.write_text(code)
          print("Applied 3 DRM client API compatibility edits to i915_driver.c")
          PY

      - name: Compile modules for target kernel
        shell: bash
        run: |
          set -euo pipefail
          make -j2 -C "$RUNNER_TEMP/kernel" \
            M="$RUNNER_TEMP/i915-sriov-dkms" \
            CC=gcc-14 HOSTCC=gcc-14 modules
          test -s "$RUNNER_TEMP/i915-sriov-dkms/drivers/gpu/drm/i915/i915.ko"

      - name: Validate and collect modules (not an installable package)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/modules
          SOURCE="$RUNNER_TEMP/i915-sriov-dkms"
          : > out/build-report.txt
          printf 'Target kernel: %s\nDriver ref: %s\nDriver commit: %s\n' \
            "$KERNEL_VERSION" "$DRIVER_REF" \
            "$(git -C "$SOURCE" rev-parse HEAD)" >> out/build-report.txt
          count=0
          while IFS= read -r -d '' module; do
            echo "Checking: $module"
            modinfo -F vermagic "$module" | tee -a out/build-report.txt
            modinfo -F vermagic "$module" | grep -Fq "$KERNEL_VERSION "
            rel="${module#"$SOURCE"/}"
            install -D -m 0644 "$module" "out/modules/$rel"
            count=$((count + 1))
          done < <(find "$SOURCE" -type f -name '*.ko' -print0)
          test "$count" -gt 0
          printf 'Compiled modules: %s\n' "$count" | tee -a out/build-report.txt
          find out/modules -type f -name '*.ko' -print
          (cd out && sha256sum $(find modules -type f -name '*.ko' | sort) > SHA256SUMS)

      # Produce a Slackware/Unraid installpkg-compatible tar.xz package.
      # Do NOT install or publish it automatically; it needs hardware testing.
      - name: Package i915 and its required compatibility module
        shell: bash
        run: |
          set -euo pipefail

          MODULES="out/modules"
          I915="$MODULES/drivers/gpu/drm/i915/i915.ko"
          COMPAT="$MODULES/compat/intel_sriov_compat.ko"
          test -s "$I915"
          test -s "$COMPAT"

          for name_file in "i915:$I915" "intel_sriov_compat:$COMPAT"; do
            name="${name_file%%:*}"
            file="${name_file#*:}"
            test "$(modinfo -F name "$file")" = "$name"
            modinfo -F vermagic "$file" | grep -Fq "$KERNEL_VERSION "
          done

          # Prevent accidentally packaging an incomplete module set.
          case ",$(modinfo -F depends "$I915")," in
            *,intel_sriov_compat,*) ;;
            *) echo "i915 does not declare expected intel_sriov_compat dependency" >&2; exit 1 ;;
          esac

          PACKAGE="i915-sriov-20260305.7-${KERNEL_VERSION}-1.txz"
          STAGE="$RUNNER_TEMP/sriov-package"
          DEST="out/packages"
          mkdir -p "$STAGE/lib/modules/$KERNEL_VERSION/kernel/drivers/gpu/drm/i915" \
                   "$STAGE/lib/modules/$KERNEL_VERSION/updates" \
                   "$STAGE/install" "$DEST"

          # Use the same layout as the original Unraid plugin and include
          # intel_sriov_compat because modinfo lists it as an i915 dependency.
          xz --check=crc32 -T1 -c "$I915" > \
            "$STAGE/lib/modules/$KERNEL_VERSION/kernel/drivers/gpu/drm/i915/i915.ko.xz"
          xz --check=crc32 -T1 -c "$COMPAT" > \
            "$STAGE/lib/modules/$KERNEL_VERSION/updates/intel_sriov_compat.ko.xz"

          cat > "$STAGE/install/slack-desc" <<EOF
                 |-----handy-ruler------------------------------------------------------|
          i915-sriov: Intel i915 SR-IOV driver for Unraid
          i915-sriov:
          i915-sriov: Target kernel: ${KERNEL_VERSION}
          i915-sriov: Source: https://github.com/strongtz/i915-sriov-dkms
          i915-sriov: Driver ref: ${DRIVER_REF}
          i915-sriov: Includes i915 and intel_sriov_compat modules.
          i915-sriov: Experimental candidate. Hardware validation required.
          i915-sriov:
          i915-sriov:
          i915-sriov:
          i915-sriov:
          EOF

          # tar.xz is the underlying archive format of a Slackware .txz.
          # Unraid installpkg accepts this layout with install/slack-desc.
          ( cd "$STAGE" && tar --sort=name --mtime=@0 \
              --owner=0 --group=0 --numeric-owner -cJf \
              "$GITHUB_WORKSPACE/$DEST/$PACKAGE" ./install ./lib )

          ( cd "$DEST" && \
              md5sum "$PACKAGE" > "$PACKAGE.md5" && \
              sha256sum "$PACKAGE" > "$PACKAGE.sha256" && \
              md5sum -c "$PACKAGE.md5" && \
              sha256sum -c "$PACKAGE.sha256" )

          # Check package file list and re-extract to verify payload bytes.
          tar -tJf "$DEST/$PACKAGE" | tee "$DEST/package-contents.txt"
          test "$(tar -tJf "$DEST/$PACKAGE" | grep -c 'i915\.ko\.xz$')" = 1
          test "$(tar -tJf "$DEST/$PACKAGE" | grep -c 'intel_sriov_compat\.ko\.xz$')" = 1
          mkdir -p "$RUNNER_TEMP/package-validation"
          tar -xJf "$DEST/$PACKAGE" -C "$RUNNER_TEMP/package-validation"
          VALID="$RUNNER_TEMP/package-validation/lib/modules/$KERNEL_VERSION"
          xz -dc "$VALID/kernel/drivers/gpu/drm/i915/i915.ko.xz" | cmp - "$I915"
          xz -dc "$VALID/updates/intel_sriov_compat.ko.xz" | cmp - "$COMPAT"

          cp out/build-report.txt "$DEST/build-report.txt"
          printf 'Package: %s\nContents verified: i915, intel_sriov_compat\nHardware validation: NOT PERFORMED\n' \
            "$PACKAGE" >> "$DEST/build-report.txt"
          ls -lh "$DEST"

      - name: Upload Unraid TXZ candidate (not a published release)
        uses: actions/upload-artifact@v4
        with:
          name: i915-sriov-6.18.58-Unraid-TXZ-candidate
          path: out/packages/
          if-no-files-found: error
          retention-days: 14

      - name: Upload compiled modules for inspection
        uses: actions/upload-artifact@v4
        with:
          name: i915-sriov-6.18.58-Unraid-unverified
          path: out/
          if-no-files-found: error
          retention-days: 7
